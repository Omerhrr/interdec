# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: interdec
    runtime: docker
    plan: starter            # needed for the disk below; see README "Deploy to Render"
    healthCheckPath: /api/health
    envVars:
      - key: INTERDEC_SECRET_KEY
        generateValue: true   # signs login tokens; Render creates a random one
      - key: INTERDEC_DATABASE_URL
        value: sqlite:////var/data/interdec.db
      # ETA email alerts: fill these in on Render (Environment tab); see README
      - key: INTERDEC_SMTP_HOST
        sync: false
      - key: INTERDEC_SMTP_PORT
        value: "587"
      - key: INTERDEC_SMTP_USER
        sync: false
      - key: INTERDEC_SMTP_PASSWORD
        sync: false
      - key: INTERDEC_SMTP_FROM
        sync: false
      - key: INTERDEC_APP_URL
        sync: false
      - key: INTERDEC_TZ
        value: Africa/Lagos
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
