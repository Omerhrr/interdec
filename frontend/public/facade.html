<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;}
body{font-family:Calibri,sans-serif;background:#fff;min-height:100vh;}
#root{width:100%;min-height:100vh;}
input,select,textarea,button{font-family:inherit;}
.inp{width:100%;border:1.5px solid #DDE4EC;border-radius:8px;padding:10px 13px;font-size:13px;outline:none;color:#0F1D2E;background:#fff;line-height:1.4;}
.inp:focus{border-color:#4A8EC2;box-shadow:0 0 0 3px rgba(74,142,194,0.12);background:#fff;}
.lbl{font-size:10px;font-weight:700;color:#607080;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;}
.chip{padding:7px 13px;border-radius:8px;font-size:12px;cursor:pointer;border:2px solid #DDE4EC;background:#fff;font-family:inherit;font-weight:500;}
.chip.on{border-color:#4A8EC2;background:#EBF4FB;color:#4A8EC2;font-weight:700;}
.chip-col{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;}
.fburger{display:none;position:fixed;top:12px;left:12px;z-index:99;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:#0B2B2B;color:#fff;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.fbackdrop{display:none;}
@media (max-width:820px){
  .fburger{display:flex;}
  .fside{transform:translateX(-100%);transition:transform .25s ease;}
  body.side-open .fside{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.45);}
  .fmain{margin-left:0!important;padding:72px 16px 24px!important;width:100%!important;}
  .fbackdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:90;}
  body.side-open .fbackdrop{display:block;}
  #root > div > div:last-child{flex-wrap:wrap;}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .fmain .inp{font-size:16px;}
}
@media print{
  body > *:not(.pz){display:none!important}
  .pz{display:block!important;position:static!important;width:100%!important;margin:0!important;padding:0!important;overflow:visible!important;border-radius:0!important;box-shadow:none!important}
  @page{margin:14mm;size:A4}
}

function nextQN(projects){var yr=new Date().getFullYear(),n=0;(projects||[]).forEach(function(p){(p.quotes||[]).forEach(function(q){if(q.number&&q.number.indexOf('IDF-'+yr)===0)n++;});});var s=''+( n+1);while(s.length<3)s='0'+s;return 'IDF-'+yr+'-'+s;}
function latestRev(q){return (q.revisions||[]).reduce(function(b,r){return(!b||r.rev>b.rev)?r:b;},null);}

function glassLabel(item,gc){var g=gc||S.gc;if(!item||!item.glassTypeId)return 'N/A';var t=null;(g.types||[]).forEach(function(x){if(x.id===item.glassTypeId)t=x;});if(!t)return 'N/A';var cn=function(id){var r='N/A';(g.colours||[]).forEach(function(c){if(c.id===id)r=c.label;});return r;};return t.isDGU?t.label+' '+item.glassThickness+' Out:'+cn(item.glassDguOuter)+'/In:'+cn(item.glassDguInner):t.label+' '+item.glassThickness+' - '+cn(item.glassColour);}
function calcBOMSingle(item,rates,gc,acpPa,hwI,hwK,sf2){
  var prod=null;PRODS.forEach(function(p){if(p.id===item.product)prod=p;});
  var isLm=prod&&prod.isLm;
  var W=isLm?parseFloat(item.length||0):parseFloat(item.width||0)/1000;
  var H=parseFloat(item.height||0)/1000;
  var qty=Math.max(1,parseInt(item.qty||1));
  var area=Math.round(W*H*qty*10000)/10000;
  var gasketLm=Math.round((5*W+5*H)*qty*1000)/1000;
  var kgFactor=(sf2||S.sf)[item.subTypeId]||0;
  var totalKg=Math.round(area*kgFactor*1000)/1000;
  var brand=(prod&&prod.brand)||'DEFAULT';
  var br=(rates||S.rates).brandRates||RATES_DEF.brandRates;
  var pRate=br[brand]!=null?+br[brand]:3400;
  var profileCost=Math.round(totalKg*pRate);
  var isAcp=item.product==='acp';
  var mRate=0;
  if(isAcp){
    if(item.ovGlassRate!=null){mRate=+item.ovGlassRate;}
    else{var ap=(acpPa||S.acpPanels)||ACP_DEF;ap.forEach(function(p){if(p.id===item.acpPanelId)mRate=p.p;});}
  } else {
    if(item.glassTypeId&&item.glassThickness){
      var g=gc||S.gc;
      var base=(g.basePrices||{})[item.glassTypeId+'__'+item.glassThickness]||0;
      var isDGU=false;(g.types||[]).forEach(function(t){if(t.id===item.glassTypeId)isDGU=t.isDGU;});
      var cp=function(id){var r=0;(g.colours||[]).forEach(function(c){if(c.id===id)r=c.premium;});return r;};
      mRate=isDGU?base+cp(item.glassDguOuter)+cp(item.glassDguInner):base+cp(item.glassColour);
    }
  }
  var glassCost=Math.round(area*mRate);
  var gasketCost=Math.round(gasketLm*((rates||S.rates).gasketRate||480));
  var kit=((hwK||S.hwKits)||HW_KITS_DEF)[item.subTypeId]||[];
  var hiArr=(hwI||S.hwItems)||HW_ITEMS_DEF;
  var kitUnit=kit.reduce(function(s,ki){var hw=null;hiArr.forEach(function(h){if(h.id===ki.id)hw=h;});return s+(hw?hw.p*ki.q:0);},0);
  var hwCost=isLm?Math.round(kitUnit*W*qty):Math.round(kitUnit*qty);
  var fabCost=Math.round(area*((rates||S.rates).fabRate||7500));
  var instCost=Math.round(area*((rates||S.rates).installRate||9500));
  var mosqRate=(item.hasMosq&&MOSQ_ELIGIBLE.indexOf(item.subTypeId)>=0)?((S.mosqRates||MOSQ_RATES_DEF)[item.subTypeId]||0):0;
  var SLIDING_MOSQ=['etw_s2','etw_s3','etw_s4','ctw_s2','ctw_s3','ctw_s4','etd_s2','etd_s3','etd_s4','ctd_s2','ctd_s3','ctd_s4'];
  var mosqArea=SLIDING_MOSQ.indexOf(item.subTypeId)>=0?area*0.5:area;
  var mosqCost=Math.round(mosqArea*mosqRate);
  var sfPerimLm=Math.round((2*W+2*H)*qty*1000)/1000;
  var sfRate=(item.hasSubframe&&SUBFRAME_ELIGIBLE.indexOf(item.subTypeId)>=0)?((rates||S.rates).subframeRate||7500):0;
  var subframeCost=Math.round(sfPerimLm*sfRate);
  var sealantLm=SUBFRAME_ELIGIBLE.indexOf(item.subTypeId)>=0?Math.round((4*W+4*H)*qty*1000)/1000:0;
  var sealantRate=(rates||S.rates).sealantRate||500;
  var sealantCost=Math.round(sealantLm*sealantRate);
  var total=profileCost+glassCost+gasketCost+hwCost+fabCost+instCost+mosqCost+subframeCost+sealantCost;
  return {W:W,H:H,qty:qty,area:area,gasketLm:gasketLm,totalKg:totalKg,pRate:pRate,kgFactor:kgFactor,mRate:mRate,glassCost:glassCost,gasketCost:gasketCost,hwCost:hwCost,fabCost:fabCost,instCost:instCost,profileCost:profileCost,mosqCost:mosqCost,mosqRate:mosqRate,sfPerimLm:sfPerimLm,sfRate:sfRate,subframeCost:subframeCost,sealantLm:sealantLm,sealantRate:sealantRate,sealantCost:sealantCost,total:total,kitUnit:kitUnit};
}
function calcBOM(item,rates,gc,acpPa,hwI,hwK,sf2){
  if(item.elements&&item.elements.length>0){
    var base=calcBOMSingle(item,rates,gc,acpPa,hwI,hwK,sf2);
    var extras=item.elements.map(function(el){
      var elItem=Object.assign({},el,{qty:item.qty||1});
      return calcBOMSingle(elItem,rates,gc,acpPa,hwI,hwK,sf2);
    });
    var keys=['profileCost','glassCost','gasketCost','hwCost','fabCost','instCost','mosqCost','sealantCost','total','totalKg','area','gasketLm','sfPerimLm','sealantLm'];
    var merged=Object.assign({},base);
    extras.forEach(function(ex){keys.forEach(function(k){merged[k]=(merged[k]||0)+(ex[k]||0);});});
    // Sub-frame on composite: 1W + 1H per element (shared edges, not full perimeter)
    if(item.hasSubframe&&SUBFRAME_ELIGIBLE.indexOf(item.subTypeId)>=0){
      var qty2=Math.max(1,parseInt(item.qty||1));
      var allEls=[item].concat(item.elements||[]);
      var totalSfLm=allEls.reduce(function(s,el){
        var W2=el.width>0?el.width/1000:(el.length||0);
        var H2=(el.height||0)/1000;
        return s+(1.5*W2+1.5*H2)*qty2;
      },0);
      totalSfLm=Math.round(totalSfLm*1000)/1000;
      var sfR=(rates||S.rates).subframeRate||7500;
      var newSfCost=Math.round(totalSfLm*sfR);
      merged.subframeCost=newSfCost;
      merged.sfRate=sfR;
      merged.sfPerimLm=totalSfLm;

}

function autoDesc(item){
  var prod=null;PRODS.forEach(function(p){if(p.id===item.product)prod=p;});
  var sub=SUBMAP[item.subTypeId];
  var brand=prod&&prod.brand||'';
  var parts=[(sub&&sub.label||prod&&prod.label||'')];
  (item.elements||[]).forEach(function(el){var s2=SUBMAP[el.subTypeId];parts.push(s2&&s2.label||el.subTypeId||'');});

}
function calcTotals(items,markup,vatRate,rates,gc,acpPa,hwI,hwK,sf2){

}

      b.addEventListener('click',function(){setTab(t.id);});
      tabBar.appendChild(b);
    });
    content.innerHTML='';
    if(id==='sp') content.appendChild(buildSPReport());
    else           content.appendChild(buildProdReport());
  }

  wrap.appendChild(dv({marginBottom:'24px'},[
    h('h1',{style:{fontSize:'22px',fontWeight:'900',color:'#0B2B2B'}},['Reports']),

  ]));
  wrap.appendChild(tabBar);
  wrap.appendChild(content);
  setTab('sp');
  return wrap;
}

function rptLatestRevisions(){
  var all=[];

// ── SVG bar chart ──────────────────────────────────────────────────────────────
function svgBar(bars,opts){
  // bars: [{label,value,color,subLabel}]
  // opts: {width,height,maxVal,fmt}
  var W=opts.width||600,H=opts.height||260;
  var padL=12,padR=12,padT=20,padB=56;
  var chartW=W-padL-padR,chartH=H-padT-padB;
  var maxVal=opts.maxVal||Math.max.apply(null,bars.map(function(b){return b.value;}))||1;
  var barW=Math.floor(chartW/bars.length)-6;
  var fmtFn=opts.fmt||function(v){return fmt(v);};
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('width','100%');svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.style.overflow='visible';

  // grid lines
  [0.25,0.5,0.75,1].forEach(function(frac){
    var y=padT+chartH-(frac*chartH);
    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',padL);line.setAttribute('x2',padL+chartW);
    line.setAttribute('y1',y);line.setAttribute('y2',y);
    line.setAttribute('stroke','#DDE4EC');line.setAttribute('stroke-width','1');
    svg.appendChild(line);
    var txt=document.createElementNS(svgNS,'text');
    txt.setAttribute('x',padL);txt.setAttribute('y',y-3);
    txt.setAttribute('font-size','9');txt.setAttribute('fill','#9CA3AF');txt.setAttribute('font-family','Calibri,sans-serif');
    txt.textContent=fmtFn(maxVal*frac);
    svg.appendChild(txt);
  });

  bars.forEach(function(bar,i){
    var x=padL+(i*(barW+6));
    var barH2=maxVal>0?Math.max(2,Math.round((bar.value/maxVal)*chartH)):2;
    var y=padT+chartH-barH2;
    var rect=document.createElementNS(svgNS,'rect');
    rect.setAttribute('x',x);rect.setAttribute('y',y);
    rect.setAttribute('width',barW);rect.setAttribute('height',barH2);
    rect.setAttribute('rx','5');rect.setAttribute('fill',bar.color||'#0B2B2B');
    rect.style.transition='all 0.3s';
    svg.appendChild(rect);
    // value label on bar
    var vt=document.createElementNS(svgNS,'text');
    vt.setAttribute('x',x+barW/2);vt.setAttribute('y',y-5);
    vt.setAttribute('text-anchor','middle');vt.setAttribute('font-size','10');
    vt.setAttribute('font-weight','700');vt.setAttribute('fill','#0B2B2B');
    vt.setAttribute('font-family','Calibri,sans-serif');
    vt.textContent=bar.value>0?fmtFn(bar.value):'';
    svg.appendChild(vt);
    // x label
    var xt=document.createElementNS(svgNS,'text');
    xt.setAttribute('x',x+barW/2);xt.setAttribute('y',padT+chartH+14);
    xt.setAttribute('text-anchor','middle');xt.setAttribute('font-size','10');
    xt.setAttribute('fill','#374151');xt.setAttribute('font-family','Calibri,sans-serif');
    xt.setAttribute('font-weight','600');
    // truncate long labels
    var lbl=bar.label.length>12?bar.label.substring(0,11)+'…':bar.label;
    xt.textContent=lbl;
    svg.appendChild(xt);
    // sub label
    if(bar.subLabel){
      var st=document.createElementNS(svgNS,'text');
      st.setAttribute('x',x+barW/2);st.setAttribute('y',padT+chartH+26);
      st.setAttribute('text-anchor','middle');st.setAttribute('font-size','9');
      st.setAttribute('fill','#9CA3AF');st.setAttribute('font-family','Calibri,sans-serif');
      st.textContent=bar.subLabel;
      svg.appendChild(st);
    }
  });
  return svg;
}

// ── SVG donut chart ────────────────────────────────────────────────────────────
function svgDonut(slices,size){
  // slices: [{label,value,color}]
  var R=size||110,r=R*0.58,cx=R,cy=R;
  var total=slices.reduce(function(s,sl){return s+sl.value;},0)||1;
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('width',R*2);svg.setAttribute('height',R*2);
  svg.setAttribute('viewBox','0 0 '+(R*2)+' '+(R*2));
  var angle=-Math.PI/2;
  slices.forEach(function(sl){
    if(!sl.value) return;
    var sweep=(sl.value/total)*(2*Math.PI);
    var x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    var x2=cx+R*Math.cos(angle+sweep),y2=cy+R*Math.sin(angle+sweep);
    var xi1=cx+r*Math.cos(angle),yi1=cy+r*Math.sin(angle);
    var xi2=cx+r*Math.cos(angle+sweep),yi2=cy+r*Math.sin(angle+sweep);
    var large=sweep>Math.PI?1:0;
    var d='M'+x1+','+y1+' A'+R+','+R+' 0 '+large+',1 '+x2+','+y2+' L'+xi2+','+yi2+' A'+r+','+r+' 0 '+large+',0 '+xi1+','+yi1+' Z';
    var path=document.createElementNS(svgNS,'path');
    path.setAttribute('d',d);path.setAttribute('fill',sl.color);
    path.setAttribute('stroke','#fff');path.setAttribute('stroke-width','2');
    svg.appendChild(path);
    angle+=sweep;
  });
  // center text
  var ct=document.createElementNS(svgNS,'text');
  ct.setAttribute('x',cx);ct.setAttribute('y',cy+4);
  ct.setAttribute('text-anchor','middle');ct.setAttribute('font-size','13');
  ct.setAttribute('font-weight','800');ct.setAttribute('fill','#0B2B2B');
  ct.setAttribute('font-family','Calibri,sans-serif');
  ct.textContent=total>0?total+'':'0';
  svg.appendChild(ct);
  var ct2=document.createElementNS(svgNS,'text');
  ct2.setAttribute('x',cx);ct2.setAttribute('y',cy+16);
  ct2.setAttribute('text-anchor','middle');ct2.setAttribute('font-size','8');
  ct2.setAttribute('fill','#9CA3AF');ct2.setAttribute('font-family','Calibri,sans-serif');
  ct2.textContent='quotes';
  svg.appendChild(ct2);
  return svg;
}
